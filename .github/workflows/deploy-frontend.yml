name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Prepare static files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 将环境变量注入 js/config.js（占位符替换）
      - name: Inject environment variables
        run: |
          sed -i "s|PLACEHOLDER_SUPABASE_URL|${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}|g"       js/config.js
          sed -i "s|PLACEHOLDER_SUPABASE_ANON_KEY|${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}|g" js/config.js
          sed -i "s|PLACEHOLDER_SUPABASE_SCHEMA|${{ secrets.NEXT_PUBLIC_SUPABASE_DB_SCHEMA }}|g"  js/config.js
          sed -i "s|PLACEHOLDER_API_BASE_URL|${{ secrets.NEXT_PUBLIC_API_BASE_URL }}|g"          js/config.js

      # 只上传静态 HTML/JS/CSS 文件，无需构建步骤
      - name: Assemble static files
        run: |
          mkdir -p dist
          cp index.html login.html app.html dist/
          cp -r js css dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
